name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: '22.22.3'

    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.11'

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Type check
      run: bun run check

    - name: Build
      run: bun run build

    - name: Test
      run: bun run test

    - name: Smoke test the built bundle
      # The bundle must start under plain node: rmapi-js imports
      # `crc-32/crc32c` extensionless and crc-32 ships no exports map, so an
      # unbundled build fails to load at all. Catch that here, not on a user's
      # machine.
      run: |
        node dist/bin/remarkable-axi.js --version
        node dist/bin/remarkable-axi.js --help > /dev/null
